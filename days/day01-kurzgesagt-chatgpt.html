<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Day 01 Kurzgesagt ChatGPT</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=block');
/* Style: Kurzgesagt-like flat vector explainer (library: "Animazione esplicativa in stile Kurzgesagt").
   Deep night gradient, stars, saturated flat palette, soft inner shading, rounded type. */
:root { --navy: #14163D; --navy2: #2A2C72; --coral: #FF6B6B; --yellow: #FFC145; --teal: #2EC4B6; --pink: #FF8FAB; --sky: #4CC9F0; --white: #FFF8EE; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--navy); }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Fredoka', sans-serif; color: var(--white);
  background: radial-gradient(ellipse 120% 70% at 50% 100%, #3B2F7A 0%, var(--navy2) 35%, var(--navy) 75%); }
.abs { position: absolute; }
.cap { position: absolute; left: 80px; width: 920px; top: 270px; text-align: center; font-weight: 700; font-size: 84px; line-height: 1.08; letter-spacing: -.01em; text-shadow: 0 6px 0 rgba(0,0,0,.25); }
.cap .y { color: var(--yellow); } .cap .t { color: var(--teal); } .cap .c { color: var(--coral); } .cap .p { color: var(--pink); }
.sub { font-size: 52px; font-weight: 500; opacity: .92; margin-top: 22px; line-height: 1.2; }
.w { display: inline-block; white-space: pre; }
.pill { position: absolute; padding: 18px 34px; border-radius: 999px; font-weight: 600; font-size: 56px; color: var(--navy); box-shadow: inset 0 -8px 0 rgba(0,0,0,.15), 0 10px 0 rgba(0,0,0,.18); white-space: nowrap; }
.card { position: absolute; background: var(--white); color: var(--navy); border-radius: 40px; box-shadow: inset 0 -12px 0 rgba(0,0,0,.08), 0 16px 0 rgba(0,0,0,.2); }
.bar { height: 74px; border-radius: 37px; display: flex; align-items: center; padding: 0 30px; font-weight: 600; font-size: 44px; color: var(--navy); box-shadow: inset 0 -8px 0 rgba(0,0,0,.15); white-space: nowrap; }
#pbar { position: absolute; left: 0; bottom: 0; height: 10px; width: 100%; background: var(--yellow); transform-origin: left; z-index: 60; }
</style></head>
<body><div id="stage">
  <canvas id="sky" width="1080" height="1920" class="abs" style="left:0;top:0"></canvas>
  <!-- planet horizon -->
  <div id="planet" class="abs" style="left:-300px;top:1580px;width:1680px;height:1680px;border-radius:50%;background:radial-gradient(circle at 50% 8%, #5A4FCF 0%, #3A2F8F 30%, #241F5E 60%);box-shadow:0 -10px 0 rgba(255,255,255,.08)"></div>

  <div id="caps"></div>
  <div id="props"></div>

  <!-- the robot character -->
  <svg id="bot" class="abs" width="420" height="520" viewBox="-210 -300 420 520" style="left:0;top:0;overflow:visible;z-index:20">
    <ellipse id="shadow" cx="0" cy="205" rx="130" ry="22" fill="rgba(0,0,0,.25)"/>
    <g id="body">
      <line x1="0" y1="-190" x2="0" y2="-245" stroke="#9AA5FF" stroke-width="12" stroke-linecap="round"/>
      <circle id="bulb" cx="0" cy="-255" r="24" fill="#FFC145"/>
      <rect x="-170" y="-200" width="340" height="300" rx="110" fill="#2EC4B6"/>
      <rect x="-170" y="-200" width="340" height="300" rx="110" fill="url(#shade)"/>
      <rect x="-125" y="-150" width="250" height="160" rx="70" fill="#14163D"/>
      <g id="eyes">
        <ellipse id="eL" cx="-50" cy="-72" rx="30" ry="36" fill="#FFF8EE"/><ellipse id="eR" cx="50" cy="-72" rx="30" ry="36" fill="#FFF8EE"/>
        <circle id="pL" cx="-44" cy="-66" r="13" fill="#14163D"/><circle id="pR" cx="56" cy="-66" r="13" fill="#14163D"/>
      </g>
      <path id="mouth" d="M-26 -18 Q0 6 26 -18" stroke="#FFF8EE" stroke-width="9" fill="none" stroke-linecap="round"/>
      <circle cx="-95" cy="-10" r="18" fill="#FF8FAB" opacity=".7"/><circle cx="95" cy="-10" r="18" fill="#FF8FAB" opacity=".7"/>
      <rect x="-120" y="105" width="240" height="90" rx="45" fill="#24A99D"/>
      <rect id="armL" x="-215" y="-20" width="60" height="130" rx="30" fill="#24A99D"/>
      <rect id="armR" x="155" y="-20" width="60" height="130" rx="30" fill="#24A99D"/>
    </g>
    <defs><linearGradient id="shade" x1="0" y1="0" x2="1" y2="1"><stop offset=".55" stop-color="rgba(0,0,0,0)"/><stop offset="1" stop-color="rgba(0,0,0,.18)"/></linearGradient></defs>
  </svg>
  <div id="pbar"></div>
</div>
<script src="../tools/lib.js"></script>
<script>
// ---- Story (vertical, sound-off friendly: every idea is on screen) ----
const SC = [
  { s: 0,    e: 4.0,  cap: 'Come fa <span class="t">ChatGPT</span> a risponderti?', sub: 'Non cerca la risposta in un archivio' },
  { s: 4.0,  e: 10.5, cap: 'Fa una cosa sola: <span class="y">indovina la parola successiva</span>' },
  { s: 10.5, e: 16.5, cap: 'Poi lo rifà. <span class="t">Parola dopo parola</span>', sub: 'finché la risposta è completa' },
  { s: 16.5, e: 22.5, cap: 'Come ha imparato? <span class="p">Leggendo</span>', sub: 'migliaia di miliardi di parole' },
  { s: 22.5, e: 29.0, cap: 'Sceglie la parola più <span class="y">probabile</span>, non quella <span class="c">vera</span>', sub: 'ecco perché a volte inventa' },
  { s: 29.0, e: 34.0, cap: 'Quindi usala per scrivere e ragionare', sub: 'ma <span class="y">verifica sempre</span> i fatti' },
  { s: 34.0, e: 38.0, cap: 'Segui per capire l\'AI <span class="y">in 30 secondi</span>' },
  { s: 38.0, e: 43.0, cap: 'Vuoi portare l\'AI nella <span class="t">tua attività</span>?', sub: 'Siti web e automazioni AI su misura' },
];
window.DURATION = 43;
const words = h => h.replace(/(<span[^>]*>)(.*?)(<\/span>)/g, (m, a, b, c) => b.split(' ').map(w => a + w + c).join(' '))
  .split(/ (?![^<]*<\/span>)/).map(w => `<span class="w">${w}</span>`).join(' ');
SC.forEach((s, i) => {
  const d = document.createElement('div'); d.className = 'cap'; d.style.display = 'none';
  d.innerHTML = words(s.cap) + (s.sub ? `<div class="sub">${words(s.sub)}</div>` : '');
  $('caps').appendChild(d); s.el = d; s.ws = [...d.querySelectorAll('.w')];
});
// ---- Props per scene ----
$('props').innerHTML = `
  <div id="qm" class="abs" style="left:810px;top:690px;font-size:200px;font-weight:700;color:#FFC145;text-shadow:0 10px 0 rgba(0,0,0,.2)">?</div>
  <div id="s2" class="abs" style="left:80px;top:700px;width:920px">
    <div class="card" style="position:relative;padding:40px 50px;font-size:72px;font-weight:600;text-align:center">Il cielo è <span id="blank" style="display:inline-block;min-width:200px;border-bottom:8px solid #14163D;color:#2EC4B6">&nbsp;</span></div>
    <div style="margin-top:50px;display:flex;flex-direction:column;gap:26px" id="bars">
      <div class="bar" style="background:#FFC145">blu <span style="margin-left:auto">62%</span></div>
      <div class="bar" style="background:#FF8FAB">sereno <span style="margin-left:auto">21%</span></div>
      <div class="bar" style="background:#4CC9F0">grigio <span style="margin-left:auto">9%</span></div>
      <div class="bar" style="background:#B8B5FF">pizza <span style="margin-left:auto">0,01%</span></div>
    </div>
    <div style="font-size:30px;opacity:.6;margin-top:24px;text-align:left">percentuali di esempio</div>
  </div>
  <div id="s3" class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>
  <div id="s4" class="abs" style="left:0;top:0;width:1080px;height:1920px"></div>
  <div id="s5" class="abs" style="left:110px;top:790px;width:860px">
    <div class="card" style="position:relative;padding:44px 50px;font-size:52px;line-height:1.3">“Secondo uno studio del 2019, il 73% delle persone…”
      <div style="margin-top:26px;font-size:34px;color:#7A7FB5">Fonte: Rossi et al., 2019</div>
    </div>
    <div id="stamp" class="abs" style="right:-20px;top:-60px;background:#FF6B6B;color:#FFF8EE;font-weight:700;font-size:64px;padding:14px 34px;border-radius:24px;transform:rotate(8deg);box-shadow:inset 0 -8px 0 rgba(0,0,0,.15)">INVENTATO</div>
  </div>
  <div id="s6" class="abs" style="left:90px;top:700px;width:900px;align-items:flex-start;display:flex;flex-direction:column;gap:34px">
    <div class="pill" style="position:relative;background:#2EC4B6">✓ Bozze e idee</div>
    <div class="pill" style="position:relative;background:#2EC4B6">✓ Riassunti e spiegazioni</div>
    <div class="pill" style="position:relative;background:#FFC145">! Numeri e fonti: controlla</div>
  </div>
  <div id="cta" class="card" style="left:140px;top:820px;width:800px;padding:46px 40px;text-align:center">
    <div style="font-size:30px;letter-spacing:.2em;color:#7A7FB5;font-weight:600">CHIEDI A</div>
    <div style="font-size:110px;font-weight:700;color:#14163D;line-height:1.1">NeuralisAI</div>
    <div class="pill" style="position:relative;display:inline-block;margin-top:24px;background:#FFC145;font-size:50px">link in bio →</div>
  </div>
  <svg id="bm" class="abs" style="left:470px;top:760px" width="140" height="180" viewBox="0 0 120 150"><path d="M10 8h100v134l-50-34-50 34z" fill="#FFC145" stroke="#14163D" stroke-width="0"/></svg>`;
// Scene 3 word chain
const chain = ['Il', 'cielo', 'è', 'blu', 'perché', "l'aria", 'diffonde', 'di', 'più', 'la', 'luce', 'blu'];
const cols = ['#FFC145', '#FF8FAB', '#4CC9F0', '#2EC4B6', '#B8B5FF', '#FF6B6B'];
$('s3').innerHTML = chain.map((w, i) => `<div class="pill" style="background:${cols[i % 6]};font-size:54px">${w}</div>`).join('');
// lay pills out in lines (measure after fonts load)
let chainPos = null;
function layoutChain() {
  chainPos = []; let x = 80, y = 680;
  [...$('s3').children].forEach(p => { const w = p.offsetWidth; if (x + w > 1000) { x = 80; y += 120; } chainPos.push([x, y]); x += w + 20; });
}
// Scene 4 flying pages
$('s4').innerHTML = Array.from({ length: 26 }, (_, i) => `<div class="card pg" style="width:120px;height:150px;border-radius:16px;padding:22px 16px">${'<div style="height:10px;background:#C9CBEF;border-radius:5px;margin-bottom:14px"></div>'.repeat(5)}</div>`).join('');
// Stars
const g = $('sky').getContext('2d');
const ST = Array.from({ length: 140 }, (_, i) => ({ x: rnd(i) * 1080, y: rnd(i + 200) * 1500, r: .8 + rnd(i + 5) * 2.4, ph: rnd(i + 9) * 6.28 }));
// Robot keyframes per scene: [x, y, scale]
const BK = [[540, 1180, 1.25], [850, 1560, .6], [540, 1440, .75], [540, 1300, .95], [300, 1440, .8], [800, 1460, .62], [540, 1330, .9], [540, 1500, .7]];
window.renderAt = function (t) {
  $('pbar').style.transform = `scaleX(${t / window.DURATION})`;
  g.clearRect(0, 0, 1080, 1920);
  for (const s of ST) { g.globalAlpha = .35 + .65 * (.5 + .5 * Math.sin(t * 2 + s.ph)); g.fillStyle = '#FFF8EE'; g.beginPath(); g.arc(s.x, s.y - t * 4, s.r, 0, 6.28); g.fill(); }
  g.globalAlpha = 1;
  css('planet', { transform: `rotate(${t * 1.5}deg)` });
  if (!chainPos) layoutChain();
  let k = 0; SC.forEach((s, i) => { if (t >= s.s) k = i; });
  const cur = SC[k], lt = t - cur.s, dur = cur.e - cur.s;
  // captions: words pop with anticipation + overshoot (Kurzgesagt bounce)
  SC.forEach(s => s.el.style.display = s === cur ? 'block' : 'none');
  const out = E.in3(seg(lt, dur - .3, dur));
  cur.ws.forEach((w, i) => { const p = E.back(seg(lt, .1 + i * .07, .45 + i * .07)); w.style.transform = `translateY(${(1 - p) * 60 - out * 40}px) scale(${.6 + .4 * p})`; w.style.opacity = Math.min(1, p * 1.5) * (1 - out); });
  // robot: move between keyframes with anticipation, idle bob, blink
  const a = BK[Math.max(0, k - 1)], b = BK[k], mp = k === 0 ? 1 : E.io3(seg(lt, 0, .7));
  const bob = Math.sin(t * 3.2) * 10, sq = 1 + Math.sin(t * 6.4) * .02;
  const bx = lerp(a[0], b[0], mp), by = lerp(a[1], b[1], mp) + bob - Math.sin(mp * Math.PI) * 120, bs = lerp(a[2], b[2], mp);
  const intro = E.back(seg(t, 0, .8));
  css('bot', { transform: `translate(${bx - 210}px,${by - 300}px) scale(${bs * intro * sq},${bs * intro / sq})`, transformOrigin: '210px 420px' });
  const blink = (t % 3.1) < .12 ? .1 : 1;
  ['eL', 'eR'].forEach(id => $(id).setAttribute('ry', 36 * blink));
  // eyes look toward the current prop
  const look = [[0, -6], [-14, -4], [0, -10], [0, -12], [14, -6], [-12, -6], [0, -4], [0, -14]][k];
  $('pL').setAttribute('cx', -50 + look[0]); $('pL').setAttribute('cy', -72 + 6 + look[1]); $('pR').setAttribute('cx', 50 + look[0]); $('pR').setAttribute('cy', -72 + 6 + look[1]);
  $('bulb').setAttribute('fill', k === 1 && lt > 3 && lt < 4 || (k === 3 && Math.floor(lt * 6) % 2) ? '#FFF8EE' : '#FFC145');
  $('mouth').setAttribute('d', k === 4 ? 'M-26 -10 Q0 -26 26 -10' : 'M-26 -18 Q0 6 26 -18');
  $('armR').setAttribute('transform', `rotate(${k === 0 ? -150 * E.out3(seg(lt, .8, 1.3)) + Math.sin(t * 8) * 12 * seg(lt, 1.3, 1.5) : k >= 6 ? -150 + Math.sin(t * 8) * 15 : Math.sin(t * 3) * 6} 185 -5)`);
  // --- scene props ---
  css('qm', { display: k === 0 ? 'block' : 'none', transform: `scale(${E.back(seg(lt, 1.0, 1.5))}) rotate(${Math.sin(t * 4) * 10}deg)`, opacity: 1 - out });
  // S2: probability bars grow, winner pops into the blank
  css('s2', { display: k === 1 ? 'block' : 'none', opacity: 1 - out });
  if (k === 1) {
    [...$('bars').children].forEach((b, i) => { const p = E.out5(seg(lt, 1.2 + i * .3, 2.0 + i * .3)); const W = [920, 660, 520, 440][i]; css(b, { width: W * p + 'px', opacity: p, transform: i === 0 && lt > 3.4 ? `scale(${1 + .06 * Math.sin((lt - 3.4) * 10) * (1 - seg(lt, 3.4, 4.2))})` : 'none', outline: i === 0 && lt > 3.4 ? '6px solid #FFF8EE' : 'none' }); });
    const fill = seg(lt, 4.0, 4.4);
    $('blank').textContent = fill > 0 ? 'blu' : ' '; css('blank', { transform: `scale(${fill > 0 ? E.back(fill) : 1})` });
  }
  // S3: words appear one after another, each with a quick "probability flash"
  css('s3', { display: k === 2 ? 'block' : 'none', opacity: 1 - out });
  if (k === 2) [...$('s3').children].forEach((p, i) => { const q = E.back(seg(lt, .6 + i * .32, .95 + i * .32)); const [x, y] = chainPos[i]; css(p, { left: x + 'px', top: y + 'px', transform: `scale(${q})`, opacity: q > 0 ? 1 : 0 }); });
  // S4: pages fly into the robot
  css('s4', { display: k === 3 ? 'block' : 'none' });
  if (k === 3) [...$('s4').children].forEach((p, i) => {
    const st = .5 + (i % 13) * .35 + Math.floor(i / 13) * .17, q = E.in3(seg(lt, st, st + 1.1));
    const sx = rnd(i) < .5 ? -150 : 1110, sy = 600 + rnd(i + 3) * 700;
    css(p, { left: lerp(sx, bx - 60, q) + 'px', top: lerp(sy, by - 260, q) + 'px', transform: `rotate(${(1 - q) * (rnd(i + 8) - .5) * 120}deg) scale(${1 - q * .7})`, opacity: q > 0 && q < 1 ? 1 : 0 });
  });
  // S5: confident but fake citation gets stamped
  css('s5', { display: k === 4 ? 'block' : 'none', opacity: 1 - out });
  if (k === 4) { const c = E.back(seg(lt, .8, 1.3)); css('s5', { transform: `scale(${c})` }); const sp = seg(lt, 3.0, 3.25); css('stamp', { transform: `rotate(8deg) scale(${lerp(2.2, 1, E.out5(sp))})`, opacity: sp }); }
  // S6: checklist
  css('s6', { display: k === 5 ? 'flex' : 'none', opacity: 1 - out });
  if (k === 5) [...$('s6').children].forEach((p, i) => { const q = E.back(seg(lt, 1.0 + i * .5, 1.4 + i * .5)); css(p, { transform: `translateX(${(1 - q) * -300}px)`, opacity: q > 0 ? 1 : 0 }); });
  // S7: bookmark
  css('cta', { display: k === 7 ? 'block' : 'none', transform: `scale(${E.back(seg(lt, .7, 1.2))}) rotate(${Math.sin(t * 2) * 1.5}deg)` });
  css('bm', { display: k === 6 ? 'block' : 'none', transform: `scale(${E.elastic(seg(lt, .6, 1.6))}) rotate(${Math.sin(t * 3) * 6}deg)` });
};
</script></body></html>
