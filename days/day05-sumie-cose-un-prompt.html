<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>Day 05 Sumi-e prompt</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Noto+Serif+JP:wght@600;900&display=block');
/* Style: living sumi-e ink painting (library: "Prompt per Film in Inchiostro Sumi-e", "Animazioni in stile acquerello
   e inchiostro"): washi paper, dry-brush strokes painted as we watch, ink washes that bleed, mist, vermilion seal. */
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #EFE7D6; }
#stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Cormorant Garamond', serif; color: #161412; }
#cv { position: absolute; inset: 0; }
#head { position: absolute; left: 90px; right: 90px; top: 250px; display: flex; justify-content: space-between; align-items: baseline; font-size: 30px; letter-spacing: .2em; color: #B3261E; font-weight: 600; }
#head .jp { font-family: 'Noto Serif JP'; letter-spacing: .1em; }
#title { position: absolute; left: 90px; right: 90px; top: 1010px; text-align: center; font-size: 104px; font-weight: 700; line-height: 1.02; }
#title i { font-weight: 600; color: #B3261E; }
#strip { position: absolute; left: 70px; right: 70px; top: 1225px; padding: 28px 40px 30px; background: rgba(250,245,234,.92); border-top: 3px solid #161412; border-bottom: 3px solid #161412; }
#strip .l { font-size: 24px; letter-spacing: .3em; font-weight: 700; color: #B3261E; }
#strip .p { font-size: 44px; font-weight: 600; line-height: 1.16; margin-top: 8px; }
#strip .p b { color: #B3261E; font-weight: 700; }
#cap { position: absolute; left: 90px; right: 90px; top: 1496px; font-size: 52px; font-style: italic; font-weight: 600; text-align: center; line-height: 1.15; }
#lesson { position: absolute; left: 90px; right: 90px; top: 400px; text-align: center; }
#lesson .big { font-size: 84px; font-weight: 700; line-height: 1.06; }
#lesson .big i { color: #B3261E; }
.three { display: flex; justify-content: space-between; margin-top: 70px; }
.three div { width: 280px; text-align: center; }
.three .k { font-family: 'Noto Serif JP'; font-weight: 900; font-size: 120px; line-height: 1.1; }
.three .t { font-size: 44px; font-weight: 700; margin-top: 6px; }
.three .s { font-size: 32px; font-style: italic; margin-top: 4px; }
#seal { position: absolute; left: 50%; top: 760px; width: 330px; height: 330px; margin-left: -165px; background: #B3261E; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #F7EFE2; box-shadow: inset 0 0 0 10px #B3261E, inset 0 0 0 14px #F7EFE2; }
#seal .a { font-family: 'Noto Serif JP'; font-weight: 900; font-size: 96px; line-height: 1; }
#seal .b { font-size: 50px; font-weight: 700; margin-top: 10px; }
#cta { position: absolute; left: 90px; right: 90px; top: 430px; text-align: center; }
#pbar { position: absolute; left: 0; bottom: 0; height: 10px; width: 100%; background: #B3261E; transform-origin: left; }
</style></head>
<body><div id="stage">
  <canvas id="cv" width="1080" height="1920"></canvas>
  <div id="head"><span>COS'È UN PROMPT</span><span class="jp">筆 · 指示</span></div>
  <div id="title">Cos'è <i>davvero</i><br>un prompt?</div>
  <div id="strip"><div class="l">IL TUO PROMPT</div><div class="p" id="ptxt"></div></div>
  <div id="cap"></div>
  <div id="lesson">
    <div class="big">Non è una formula magica.<br>È una <i>descrizione</i>:<br>ogni parola è una pennellata</div>
    <div class="three">
      <div><div class="k">一</div><div class="t">Cosa</div><div class="s">il soggetto</div></div>
      <div><div class="k">二</div><div class="t">Contesto</div><div class="s">dove, quando, per chi</div></div>
      <div><div class="k">三</div><div class="t">Stile</div><div class="s">come deve essere</div></div>
    </div>
  </div>
  <div id="cta">
    <div style="font-size:84px;font-weight:700;line-height:1.05">Vuoi portare l'AI nella <i style="color:#B3261E">tua attività</i>?</div>
    <div style="font-size:46px;font-style:italic;margin-top:24px">Siti web e automazioni AI su misura</div>
  </div>
  <div id="seal"><div class="a">印</div><div class="b">NeuralisAI</div></div>
  <div id="pbar"></div>
</div>
<script src="../tools/lib.js"></script>
<script>
const g = $('cv').getContext('2d');
// ---------- washi paper (fibres + blotches), painted once ----------
const PAPER = document.createElement('canvas'); PAPER.width = 1080; PAPER.height = 1920;
(() => {
  const p = PAPER.getContext('2d');
  p.fillStyle = '#EFE7D6'; p.fillRect(0, 0, 1080, 1920);
  for (let i = 0; i < 60; i++) { const gr = p.createRadialGradient(rnd(i) * 1080, rnd(i + 9) * 1920, 0, rnd(i) * 1080, rnd(i + 9) * 1920, 120 + rnd(i + 3) * 260);
    gr.addColorStop(0, `rgba(196,176,140,${.05 + rnd(i + 5) * .06})`); gr.addColorStop(1, 'rgba(196,176,140,0)'); p.fillStyle = gr; p.fillRect(0, 0, 1080, 1920); }
  p.strokeStyle = 'rgba(150,130,100,.12)'; p.lineWidth = 1;
  for (let i = 0; i < 900; i++) { const x = rnd(i * 3) * 1080, y = rnd(i * 3 + 1) * 1920, a = rnd(i * 3 + 2) * 6.28, l = 10 + rnd(i + 77) * 40;
    p.beginPath(); p.moveTo(x, y); p.quadraticCurveTo(x + Math.cos(a) * l * .5 + 6, y + Math.sin(a) * l * .5, x + Math.cos(a) * l, y + Math.sin(a) * l); p.stroke(); }
})();
// ---------- dry-brush stroke, cached once complete ----------
const CACHE = {};
function brush(id, pts, w, prog, ink = '22,20,18', dry = .55, seed = 1) {
  if (prog <= 0) return;
  if (prog >= 1 && CACHE[id]) { g.drawImage(CACHE[id], 0, 0); return; }
  let ctx = g, off = null;
  if (prog >= 1) { off = document.createElement('canvas'); off.width = 1080; off.height = 1920; ctx = off.getContext('2d'); }
  // densify the polyline with Catmull-Rom so strokes stay smooth
  const P = [];
  for (let i = 0; i < pts.length - 1; i++) { const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
    for (let s = 0; s < 1; s += .05) { const t2 = s * s, t3 = t2 * s;
      P.push([.5 * (2 * p1[0] + (-p0[0] + p2[0]) * s + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3),
              .5 * (2 * p1[1] + (-p0[1] + p2[1]) * s + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]); } }
  P.push(pts[pts.length - 1]);
  const L = [0]; for (let i = 1; i < P.length; i++) L.push(L[i - 1] + Math.hypot(P[i][0] - P[i - 1][0], P[i][1] - P[i - 1][1]));
  const tot = L[L.length - 1], lim = tot * Math.min(1, prog), N = 18;
  let j = 1;
  for (let s = 0; s < lim; s += 2.2) {
    while (j < P.length - 1 && L[j] < s) j++;
    const a = P[j - 1], b = P[j], f = (s - L[j - 1]) / Math.max(1e-6, L[j] - L[j - 1]);
    const x = lerp(a[0], b[0], f), y = lerp(a[1], b[1], f), dx = b[0] - a[0], dy = b[1] - a[1], dl = Math.hypot(dx, dy) || 1, nx = -dy / dl, ny = dx / dl;
    const u = s / tot, wt = w * Math.pow(Math.sin(Math.PI * Math.min(.98, u * .92 + .04)), .45) * (1.15 - .35 * u);
    for (let k = 0; k < N; k++) {
      if (rnd(seed * 97 + k * 13 + Math.floor(s / 9)) < dry * Math.pow(u, 1.6) * (Math.abs(k / (N - 1) - .5) * 2 + .3)) continue;   // dry-brush gaps, mostly at the tail and edges
      const o = (k / (N - 1) - .5) * wt, al = (.35 + .5 * rnd(seed + k * 7)) * (1 - .35 * u);
      ctx.fillStyle = `rgba(${ink},${al})`; ctx.fillRect(x + nx * o, y + ny * o, 2.2, 2.2);
    }
  }
  if (off) { CACHE[id] = off; g.drawImage(off, 0, 0); }
}
// ---------- ink washes ----------
let DIM = 1;   // painting fade used by the lesson scene (washes set their own alpha)
function wash(poly, alpha, blur, col = '22,20,18', grad = [0, 1]) {
  if (alpha <= 0) return;
  g.save(); g.filter = `blur(${blur}px)`; g.globalAlpha = alpha * DIM;
  const ys = poly.map(p => p[1]), top = Math.min(...ys), bot = Math.max(...ys);
  const gr = g.createLinearGradient(0, top, 0, bot); gr.addColorStop(grad[0], `rgba(${col},.75)`); gr.addColorStop(grad[1], `rgba(${col},0)`);
  g.fillStyle = gr; g.beginPath(); poly.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])); g.closePath(); g.fill(); g.restore();
}
// ---------- the painting ----------
const ENSO = Array.from({ length: 40 }, (_, i) => { const a = -1.9 + i / 39 * 5.75; return [540 + Math.cos(a) * 230 * (1 + .03 * Math.sin(i)), 760 + Math.sin(a) * 230]; });
const MTN = [[120, 1110], [300, 820], [400, 720], [455, 750], [560, 600], [640, 720], [700, 790], [800, 900], [960, 1110]];
const MTN2 = [[540, 610], [585, 690], [610, 760], [600, 860]];               // inner ridge
const BGL = [[0, 1110], [0, 900], [120, 840], [220, 870], [300, 920], [380, 1110]];
const BGR = [[700, 1110], [800, 880], [880, 840], [980, 870], [1080, 900], [1080, 1110]];
const LAKE = [[[200, 1150], [330, 1146], [460, 1152]], [[560, 1170], [700, 1166], [860, 1172]], [[300, 1200], [420, 1197], [520, 1201]]];
const BOAT = [[390, 1112], [430, 1126], [500, 1126], [540, 1110]];
const MAN = [[455, 1110], [458, 1062]], ROD = [[460, 1070], [530, 1010], [600, 975]], LINE = [[600, 975], [604, 1040], [606, 1118]];
// ---------- timeline ----------
const HOOK = 3.5, SD = 6, S = [HOOK, HOOK + SD, HOOK + 2 * SD, HOOK + 3 * SD], LES = HOOK + 4 * SD, TF = LES + 6, TC = TF + 3;
window.DURATION = TC + 5;   // 41.5 s
window.SCENE_STARTS = [HOOK, ...S.slice(1), LES, TF, TC];
const PROMPTS = ['Dipingi una montagna', ', all\'alba', ', con un pescatore su una barca nel lago', '. Stile minimalista, tanto spazio vuoto'];
const CAPS = ['Un prompt vago dà un risultato <span style="color:#B3261E">generico</span>', 'Ogni dettaglio <span style="color:#B3261E">cambia</span> il risultato', 'Il contesto guida le <span style="color:#B3261E">scelte</span>', 'Anche lo <span style="color:#B3261E">stile</span> si chiede'];
function typed(t) {
  // cumulative prompt; the part added in the current scene is typed in red
  let k = -1; S.forEach((s, i) => { if (t >= s) k = i; });
  if (k < 0) return '';
  const old = PROMPTS.slice(0, k).join(''), add = PROMPTS[k], n = Math.floor(add.length * seg(t - S[k], .2, 1.6));
  return `${old}<b>${add.slice(0, n)}</b>${n < add.length && Math.floor(t * 4) % 2 ? '|' : ''}`;
}
window.renderAt = function (t) {
  $('pbar').style.transform = `scaleX(${t / window.DURATION})`;
  g.drawImage(PAPER, 0, 0);
  const inPaint = t < LES + .6, k = S.reduce((m, s, i) => t >= s ? i : m, -1);
  const dim = t >= LES ? lerp(1, .06, E.io3(seg(t, LES, LES + .8))) : 1;
  DIM = dim;
  const minimal = E.io3(seg(t, S[3] + 1.2, S[3] + 3.2));   // scene 4: strip the painting down
  if (t < HOOK + .8) { // ensō for the hook
    g.globalAlpha = 1 - seg(t, HOOK, HOOK + .8); brush('enso', ENSO, 40, E.io3(seg(t, .1, 1.6)), '22,20,18', .7, 3); g.globalAlpha = 1;
  }
  if (t >= HOOK && t < TF) {
    g.save(); g.globalAlpha = dim;
    // background hills (painted in scene 1, removed in scene 4)
    wash(BGL, E.out3(seg(t, S[0] + 1.4, S[0] + 3)) * .55 * (1 - minimal), 10, '60,58,56');
    wash(BGR, E.out3(seg(t, S[0] + 1.6, S[0] + 3.2)) * .55 * (1 - minimal), 10, '60,58,56');
    // scene 2: sky warms, sun rises behind the mountain
    if (t >= S[1]) {
      const sp = E.out3(seg(t, S[1] + 1.0, S[1] + 3.5));
      g.save(); g.globalAlpha = dim * sp * .9; g.filter = 'blur(3px)'; g.fillStyle = '#C8331F';
      g.beginPath(); g.arc(720, lerp(700, 560, sp), 72, 0, 6.28); g.fill(); g.restore();
      g.save(); g.globalAlpha = dim * sp * .25; const gr = g.createRadialGradient(720, 560, 60, 720, 560, 400); gr.addColorStop(0, 'rgba(230,140,90,.8)'); gr.addColorStop(1, 'rgba(230,140,90,0)'); g.fillStyle = gr; g.fillRect(0, 300, 1080, 900); g.restore();
    }
    // main mountain: wash + contour
    wash([...MTN, [960, 1120], [120, 1120]], E.out3(seg(t, S[0] + .8, S[0] + 2.6)), lerp(14, 4, seg(t, S[0] + .8, S[0] + 2.6)), '22,20,18', [0, 1]);
    brush('mtn', MTN, 26, E.io3(seg(t, S[0] + .3, S[0] + 2.0)), '22,20,18', .55, 5);
    brush('mtn2', MTN2, 14, E.io3(seg(t, S[0] + 2.0, S[0] + 2.8)) * (1 - minimal), '22,20,18', .7, 9);
    // scene 3: lake, boat, fisherman
    if (t >= S[2]) {
      LAKE.forEach((l, i) => brush('lake' + i, l, 8, E.io3(seg(t, S[2] + .6 + i * .3, S[2] + 1.4 + i * .3)), '40,38,36', .6, 20 + i));
      brush('boat', BOAT, 18, E.io3(seg(t, S[2] + 1.6, S[2] + 2.3)), '22,20,18', .4, 30);
      brush('man', MAN, 14, E.io3(seg(t, S[2] + 2.3, S[2] + 2.7)), '22,20,18', .3, 31);
      if (t > S[2] + 2.6) { g.fillStyle = 'rgba(22,20,18,.85)'; g.beginPath(); g.arc(457, 1052, 11, 0, 6.28); g.fill(); }
      brush('rod', ROD, 5, E.io3(seg(t, S[2] + 2.7, S[2] + 3.2)), '22,20,18', .3, 32);
      brush('line', LINE, 2, E.io3(seg(t, S[2] + 3.2, S[2] + 3.6)), '22,20,18', 0, 33);
    }
    // mist: drifting light bands, thicker in the minimal scene
    for (let i = 0; i < 3; i++) {
      const y = 880 + i * 90 + Math.sin(t * .4 + i) * 20, a = (.25 + minimal * .45) * seg(t, S[0], S[0] + 2);
      const gr = g.createLinearGradient(0, y - 60, 0, y + 60); gr.addColorStop(0, 'rgba(239,231,214,0)'); gr.addColorStop(.5, `rgba(239,231,214,${a})`); gr.addColorStop(1, 'rgba(239,231,214,0)');
      g.fillStyle = gr; g.fillRect(((t * 18 + i * 200) % 300) - 300, y - 60, 1700, 120);
    }
    g.restore();
  }
  // ---------- overlays ----------
  css('title', { display: t < HOOK ? 'block' : 'none', opacity: E.out3(seg(t, .5, 1.3)) * (1 - seg(t, HOOK - .3, HOOK)), transform: `translateY(${(1 - E.out3(seg(t, .5, 1.3))) * 30}px)` });
  css('head', { opacity: t < TC ? 1 : 0 });
  const showStrip = t >= HOOK && t < LES;
  css('strip', { display: showStrip ? 'block' : 'none', opacity: seg(t, HOOK, HOOK + .4) * (1 - seg(t, LES - .3, LES)) });
  if (showStrip) $('ptxt').innerHTML = typed(t);
  css('cap', { display: showStrip ? 'block' : 'none' });
  if (showStrip && k >= 0) { $('cap').innerHTML = CAPS[k]; const lt = t - S[k]; css('cap', { opacity: seg(lt, 2.0, 2.6) * (1 - seg(lt, SD - .3, SD)), transform: `translateY(${(1 - E.out3(seg(lt, 2, 2.6))) * 20}px)` }); }
  const ls = t >= LES && t < TF;
  css('lesson', { display: ls ? 'block' : 'none', opacity: seg(t, LES + .4, LES + 1) * (1 - seg(t, TF - .3, TF)) });
  if (ls) [...document.querySelectorAll('.three > div')].forEach((d, i) => { const p = E.out3(seg(t, LES + 1.6 + i * .5, LES + 2.2 + i * .5)); d.style.opacity = p; d.style.transform = `translateY(${(1 - p) * 30}px)`; });
  // follow: the ensō again, with the invitation in the middle
  if (t >= TF && t < TC) { brush('enso', ENSO, 40, 1); }
  if (t >= TF && t < TC) { css('title', { display: 'block', opacity: seg(t, TF, TF + .5), transform: 'none', top: '1030px', fontSize: '84px' }); $('title').innerHTML = 'Segui:<br>ogni giorno<br>una <i>pennellata</i><br>di AI'; }
  else { css('title', { top: '1010px', fontSize: '104px' }); $('title').innerHTML = "Cos'è <i>davvero</i><br>un prompt?"; if (t >= HOOK) css('title', { display: 'none' }); }
  // CTA with the vermilion seal stamped down
  const ct = t >= TC;
  css('cta', { display: ct ? 'block' : 'none', opacity: seg(t, TC + .1, TC + .6) });
  css('seal', { display: ct ? 'flex' : 'none', opacity: seg(t, TC + .9, TC + 1.1), transform: `scale(${lerp(1.8, 1, E.out5(seg(t, TC + .9, TC + 1.25)))}) rotate(-4deg)` });
  if (ct) { g.fillStyle = 'rgba(22,20,18,.9)'; g.font = "italic 600 46px 'Cormorant Garamond'"; g.textAlign = 'center'; g.globalAlpha = seg(t, TC + 1.6, TC + 2.0); g.fillText('→ link in bio', 540, 1220); g.globalAlpha = 1; g.textAlign = 'left'; }
};
</script></body></html>
